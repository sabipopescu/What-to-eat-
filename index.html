<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dinner for two</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f5f1;--card:#fff;--ink:#16211c;--mute:#66736c;--line:#dde4de;--a:#2f5bea;--b:#f0643c;--go:#1f6b4a;--go-ink:#fff;--chip:#e8eee9;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121815;--card:#1b2420;--ink:#eaf1ec;--mute:#93a39a;--line:#2c3832;--a:#7e9bff;--b:#ff8d6b;--go:#58c08c;--go-ink:#0b1a12;--chip:#25302a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121815;--card:#1b2420;--ink:#eaf1ec;--mute:#93a39a;--line:#2c3832;--a:#7e9bff;--b:#ff8d6b;--go:#58c08c;--go-ink:#0b1a12;--chip:#25302a;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:400 16px/1.45 "Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:560px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:30px;line-height:1.1;font-weight:800;margin:8px 0 4px;letter-spacing:-.02em}
.sub{color:var(--mute);margin:0 0 18px}
.tabs{display:flex;gap:6px;background:var(--chip);padding:4px;border-radius:14px;margin-bottom:18px}
.tabs button{flex:1;border:0;background:none;color:var(--mute);font:600 15px inherit;font-family:inherit;padding:10px;border-radius:10px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--card);color:var(--ink)}
button:focus-visible,input:focus-visible{outline:3px solid var(--go);outline-offset:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.names{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.names label{font-size:13px;color:var(--mute);display:block;margin-bottom:4px}
input[type=text]{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.add{display:flex;gap:8px;margin-bottom:14px}
.btn{border:0;background:var(--go);color:var(--go-ink);font:700 16px inherit;font-family:inherit;padding:12px 18px;border-radius:12px;cursor:pointer}
.btn.big{width:100%;padding:16px;font-size:18px}
.btn.ghost{background:var(--chip);color:var(--ink)}
.btn.small{padding:8px 12px;font-size:14px}
.place h3{margin:0;font-size:19px;font-weight:700}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px}
.who{font-size:14px;font-weight:600;min-width:72px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dots{display:flex;gap:6px}
.dots button{width:36px;height:36px;border-radius:50%;border:2px solid var(--line);background:none;cursor:pointer;color:var(--mute);font:600 13px inherit;font-family:inherit;padding:0}
.dots.a button.on{background:var(--a);border-color:var(--a);color:#fff}
.dots.b button.on{background:var(--b);border-color:var(--b);color:#fff}
.meta{display:flex;justify-content:space-between;align-items:center;margin-top:12px;color:var(--mute);font-size:14px}
.link{background:none;border:0;color:var(--mute);text-decoration:underline;cursor:pointer;font:inherit;padding:4px}
.hint{color:var(--mute);font-size:14px;margin:6px 0 14px}
.dt{display:flex;align-items:center;gap:8px;font-size:14px}
.dt input{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.pick{border-width:2px;border-color:var(--go)}
.pick h3{font-size:24px}
.pick.rest{border-width:1px;border-color:var(--line)}
.why{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 12px}
.why span{background:var(--chip);border-radius:99px;padding:3px 10px;font-size:13px}
.split{display:flex;gap:10px;margin:8px 0 12px;font-size:14px;color:var(--mute)}
.split b{color:var(--ink)}
.empty{text-align:center;color:var(--mute);padding:28px 12px}
@media (prefers-reduced-motion:no-preference){.pick{animation:pop .25s ease-out}@keyframes pop{from{transform:scale(.97);opacity:.5}}}
</style>
</head>
<body>
<main>
  <h1>Dinner for two</h1>
  <p class="sub">Rate your spots separately. We find where you both win, and nudge you toward somewhere you haven't been lately.</p>

  <div class="tabs" role="tablist">
    <button role="tab" id="t-pick" aria-selected="true">Pick tonight</button>
    <button role="tab" id="t-places" aria-selected="false">Our places</button>
  </div>

  <section id="v-pick"></section>
  <section id="v-places" hidden></section>
</main>

<script>
const KEY = 'dinner-for-two-v1';
let S = { names: ['Me', 'Partner'], places: [], shown: [] };
try { const r = localStorage.getItem(KEY); if (r) S = Object.assign(S, JSON.parse(r)); } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $ = id => document.getElementById(id);

const daysSince = d => d ? Math.max(0, Math.floor((Date.now() - new Date(d).getTime()) / 864e5)) : null;
const toInput = d => { const x = new Date(d), p = n => String(n).padStart(2, '0'); return `${x.getFullYear()}-${p(x.getMonth() + 1)}-${p(x.getDate())}`; };
const ago = n => n === null ? 'Never been' : n === 0 ? 'Went today' : n === 1 ? 'Went yesterday' : n < 14 ? `Went ${n} days ago` : n < 60 ? `Went ${Math.round(n/7)} weeks ago` : `Went ${Math.round(n/30)} months ago`;

function score(p) {
  if (p.a <= 1 || p.b <= 1) return -1; // a 1 from either person is a veto
  const match = Math.sqrt(p.a * p.b) / 5 * 70;
  const n = daysSince(p.last);
  const fresh = n === null ? 22 : Math.min(n, 21) / 21 * 30;
  return match + fresh;
}
function reasons(p) {
  const r = [], n = daysSince(p.last);
  if (p.a >= 4 && p.b >= 4) r.push('You both love it');
  else if (Math.abs(p.a - p.b) >= 2) r.push(`${esc(p.a > p.b ? S.names[0] : S.names[1])} is keener`);
  else r.push('Solid middle ground');
  if (n === null) r.push('New to you');
  else if (n >= 14) r.push('Been a while');
  else if (n < 4) r.push('Recent visit');
  return r;
}

function dots(person, cls, p) {
  return `<div class="dots ${cls}" role="group" aria-label="${esc(S.names[person])} rating for ${esc(p.name)}">` +
    [1,2,3,4,5].map(v => `<button class="${(person ? p.b : p.a) >= v ? 'on' : ''}" data-rate="${p.id}" data-who="${person}" data-v="${v}" aria-label="${v} of 5">${v}</button>`).join('') + '</div>';
}

function renderPlaces() {
  const el = $('v-places');
  const list = S.places.map(p => `
    <div class="card place">
      <h3>${esc(p.name)}</h3>
      <div class="row"><span class="who" style="color:var(--a)">${esc(S.names[0])}</span>${dots(0,'a',p)}</div>
      <div class="row"><span class="who" style="color:var(--b)">${esc(S.names[1])}</span>${dots(1,'b',p)}</div>
      <div class="meta"><label class="dt">Last ordered <input type="date" data-date="${p.id}" value="${p.last ? toInput(p.last) : ''}" max="${toInput(new Date())}"></label><span>${ago(daysSince(p.last))}</span></div><div class="meta" style="justify-content:flex-end;margin-top:4px">
        <span><button class="link" data-went="${p.id}">We went today</button><button class="link" data-del="${p.id}">Remove</button></span></div>
    </div>`).join('');
  el.innerHTML = `
    <div class="names">
      <div><label for="n0">First person</label><input type="text" id="n0" value="${esc(S.names[0])}" maxlength="16"></div>
      <div><label for="n1">Second person</label><input type="text" id="n1" value="${esc(S.names[1])}" maxlength="16"></div>
    </div>
    <form class="add" id="addForm" onsubmit="return false">
      <input type="text" id="newName" placeholder="Add a restaurant" maxlength="40" aria-label="Restaurant name">
      <button class="btn" id="addBtn" type="button">Add</button>
    </form>
    <p class="hint">Rate 1 to 5. A 1 means "not tonight," and keeps that place off the picks.</p>
    ${list || '<div class="empty">No places yet. Add the spots you both think of first.</div>'}`;
}

function renderPick() {
  const el = $('v-pick');
  const ok = S.places.filter(p => score(p) >= 0);
  if (!S.places.length) { el.innerHTML = '<div class="empty">Add a few restaurants under "Our places" and rate them, then come back here.</div>'; return; }
  if (!ok.length) { el.innerHTML = '<div class="empty">Every place has a 1 from someone. Add more spots or raise a rating.</div>'; return; }
  const picks = S.shown.map(id => S.places.find(p => p.id === id)).filter(p => p && score(p) >= 0);
  if (!picks.length) {
    el.innerHTML = `<div class="card"><p style="margin-top:0">${ok.length} place${ok.length > 1 ? 's' : ''} work for both of you.</p><button class="btn big" id="doPick">Pick tonight's top 3</button></div>`;
    return;
  }
  el.innerHTML = picks.map((p, i) => `
    <div class="card pick ${i ? 'rest' : ''}">
      <h3>${esc(p.name)}</h3>
      <div class="why">${reasons(p).map(r => `<span>${r}</span>`).join('')}</div>
      <div class="split"><span style="color:var(--a)">${esc(S.names[0])} <b>${p.a}/5</b></span><span style="color:var(--b)">${esc(S.names[1])} <b>${p.b}/5</b></span><span>${ago(daysSince(p.last))}</span></div>
      <button class="btn ${i ? 'ghost' : ''} small" data-went="${p.id}" data-fromPick="1">We're going here</button>
    </div>`).join('') + `<button class="btn ghost big" id="doPick">Shuffle again</button>`;
}

function doPick() {
  const ranked = S.places.map(p => ({ p, s: score(p) })).filter(x => x.s >= 0)
    .map(x => ({ ...x, s: x.s + Math.random() * 14 })).sort((x, y) => y.s - x.s);
  S.shown = ranked.slice(0, 3).map(x => x.p.id);
  save(); renderPick();
}

document.addEventListener('click', e => {
  const t = e.target.closest('button'); if (!t) return;
  if (t.id === 't-pick' || t.id === 't-places') {
    const pick = t.id === 't-pick';
    $('t-pick').setAttribute('aria-selected', pick); $('t-places').setAttribute('aria-selected', !pick);
    $('v-pick').hidden = !pick; $('v-places').hidden = pick;
    pick ? renderPick() : renderPlaces(); return;
  }
  if (t.id === 'doPick') return doPick();
  if (t.id === 'addBtn') {
    const inp = $('newName'), name = inp.value.trim(); if (!name) { inp.focus(); return; }
    S.places.unshift({ id: Date.now().toString(36), name, a: 3, b: 3, last: null });
    save(); renderPlaces(); $('newName').focus(); return;
  }
  if (t.dataset.rate) {
    const p = S.places.find(x => x.id === t.dataset.rate);
    p[t.dataset.who === '0' ? 'a' : 'b'] = +t.dataset.v; S.shown = []; save(); renderPlaces(); return;
  }
  if (t.dataset.went) {
    const p = S.places.find(x => x.id === t.dataset.went);
    p.last = new Date().toISOString(); S.shown = []; save();
    t.dataset.frompick ? renderPick() : renderPlaces(); return;
  }
  if (t.dataset.del) {
    S.places = S.places.filter(x => x.id !== t.dataset.del); S.shown = []; save(); renderPlaces();
  }
});
document.addEventListener('input', e => {
  if (e.target.id === 'n0' || e.target.id === 'n1') {
    S.names[e.target.id === 'n0' ? 0 : 1] = e.target.value || (e.target.id === 'n0' ? 'Me' : 'Partner'); save();
  }
});
document.addEventListener('change', e => {
  if (e.target.id === 'n0' || e.target.id === 'n1') renderPlaces();
  if (e.target.dataset.date) {
    const p = S.places.find(x => x.id === e.target.dataset.date), v = e.target.value;
    p.last = v ? new Date(v + 'T12:00:00').toISOString() : null; S.shown = []; save(); renderPlaces();
  }
});
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.id === 'newName') $('addBtn').click(); });

renderPick(); renderPlaces();
</script>
</body>
</html>
